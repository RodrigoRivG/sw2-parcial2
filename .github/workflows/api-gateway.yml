name: api-gateway

on:
  push:
    paths:
      - "servicios/api-gateway/**"
      - ".github/workflows/api-gateway.yml"
  pull_request:
    paths:
      - "servicios/api-gateway/**"
      - ".github/workflows/api-gateway.yml"

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicios/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: servicios/api-gateway/pom.xml
      - name: Compilar, probar y medir cobertura
        run: mvn -B verify
      - name: Construir la imagen Docker
        run: docker build -t api-gateway:${{ github.sha }} .
