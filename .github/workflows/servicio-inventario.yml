name: servicio-inventario

on:
  push:
    paths:
      - "servicios/servicio-inventario/**"
      - ".github/workflows/servicio-inventario.yml"
  pull_request:
    paths:
      - "servicios/servicio-inventario/**"
      - ".github/workflows/servicio-inventario.yml"

jobs:
  construir:
    # No ubuntu-latest: su kernel Ubuntu 7.0.0-*-azure hace que MongoDB 8.x se niegue a arrancar
    # (SERVER-121912, y SERVER-136848 abierto: el chequeo lee "7.0.0" y no el parche de Ubuntu).
    # Los tests usan mongo:8.0, la imagen de Docker Compose, así que se usa un runner con kernel 6.x.
    # Volver a ubuntu-latest cuando se cierre SERVER-136848.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: servicios/servicio-inventario
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: servicios/servicio-inventario/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar estilo
        run: npm run lint
      - name: Compilar
        run: npm run build
      - name: Probar y medir cobertura
        run: npm test -- --coverage
      - name: Diagnóstico del entorno de Docker
        if: failure()
        run: |
          uname -a
          cat /proc/version_signature || true
          docker version
      - name: Construir la imagen Docker
        run: docker build -t servicio-inventario:${{ github.sha }} .
