name: servicio-gestion

on:
  push:
    paths:
      - "servicios/servicio-gestion/**"
      - ".github/workflows/servicio-gestion.yml"
  pull_request:
    paths:
      - "servicios/servicio-gestion/**"
      - ".github/workflows/servicio-gestion.yml"

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicios/servicio-gestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: servicios/servicio-gestion/pom.xml
      - name: Compilar, probar y medir cobertura
        run: mvn -B verify
      - name: Construir la imagen Docker
        run: docker build -t servicio-gestion:${{ github.sha }} .
