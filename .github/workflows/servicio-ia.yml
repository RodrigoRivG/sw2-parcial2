name: servicio-ia

on:
  push:
    paths:
      - "servicios/servicio-ia/**"
      - ".github/workflows/servicio-ia.yml"
  pull_request:
    paths:
      - "servicios/servicio-ia/**"
      - ".github/workflows/servicio-ia.yml"

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicios/servicio-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servicios/servicio-ia/pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Revisar estilo
        run: |
          ruff check .
          ruff format --check .
      - name: Revisar tipos
        run: mypy
      - name: Probar y medir cobertura
        run: pytest --cov
      - name: Construir la imagen Docker
        run: docker build -t servicio-ia:${{ github.sha }} .
