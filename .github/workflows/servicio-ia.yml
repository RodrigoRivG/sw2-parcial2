name: servicio-ia

on:
  push:
    paths:
      - "servicios/servicio-ia/**"
      - ".github/workflows/servicio-ia.yml"
  pull_request:
    paths:
      - "servicios/servicio-ia/**"
      - ".github/workflows/servicio-ia.yml"

jobs:
  construir:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: servicios/servicio-ia
    # La misma imagen de RabbitMQ que Docker Compose (spec-trabajos.md 2.13)
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: sw2
          RABBITMQ_DEFAULT_PASS: sw2pass
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: s3
        options: >-
          --health-cmd "python3 -c \"import urllib.request,json,sys; s=json.load(urllib.request.urlopen('http://localhost:4566/_localstack/health'))['services'].get('s3'); sys.exit(0 if s in ('available','running') else 1)\""
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 20s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      AWS_ENDPOINT: http://localhost:4566
      AWS_BUCKET: ia-pruebas
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      RABBITMQ_URL: amqp://sw2:sw2pass@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - name: Levantar MongoDB como replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0,host:"localhost:27017"}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              exit 0
            fi
            sleep 2
          done
          docker logs mongo
          exit 1
      - name: Crear bucket local de pruebas
        run: docker exec "${{ job.services.localstack.id }}" awslocal s3 mb s3://ia-pruebas
      # WeasyPrint (PDF de los reportes) y la fuente que usan sus tests (spec-reportes.md 2.11)
      # Jammy no publica libharfbuzz-subset0; WeasyPrint usa fontTools como alternativa.
      - name: Instalar librerías del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servicios/servicio-ia/pyproject.toml
      - name: Instalar dependencias
        run: |
          pip install -e ".[dev,ml]"
          # Sin dependencias: arrastrarían tensorflow-decision-forests (spec-vision.md 2.1)
          pip install --no-deps tensorflowjs==4.22.0
      - name: Revisar estilo
        run: |
          ruff check .
          ruff format --check .
      - name: Revisar tipos
        run: mypy
      - name: Probar y medir cobertura
        run: pytest --cov
      - name: Construir la imagen Docker
        run: docker build -t servicio-ia:${{ github.sha }} .
