name: servicio-ia

on:
  push:
    paths:
      - "servicios/servicio-ia/**"
      - ".github/workflows/servicio-ia.yml"
  pull_request:
    paths:
      - "servicios/servicio-ia/**"
      - ".github/workflows/servicio-ia.yml"

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicios/servicio-ia
    # La misma imagen de RabbitMQ que Docker Compose (spec-trabajos.md 2.13)
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: sw2
          RABBITMQ_DEFAULT_PASS: sw2pass
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRESTORE_EMULATOR_HOST: localhost:8080
      STORAGE_EMULATOR_HOST: http://localhost:4443
      GOOGLE_CLOUD_PROJECT: sw2-ci
      RABBITMQ_URL: amqp://sw2:sw2pass@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      # Cloud Storage emulado con la misma imagen y opciones que Docker Compose (spec-prediccion.md)
      - name: Levantar el emulador de Cloud Storage
        run: |
          docker run -d --name gcs -p 4443:4443 fsouza/fake-gcs-server:latest \
            -scheme http -port 4443 -external-url http://localhost:4443
          for i in $(seq 1 30); do
            curl -sf http://localhost:4443/storage/v1/b >/dev/null && exit 0
            sleep 1
          done
          docker logs gcs
          exit 1
      # Los contenedores de servicio no aceptan `command`; el emulador se levanta a mano
      - name: Levantar el emulador de Firestore
        run: |
          docker run -d --name firestore -p 8080:8080 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=sw2-ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/ >/dev/null && exit 0
            sleep 2
          done
          docker logs firestore
          exit 1
      # WeasyPrint (PDF de los reportes) y la fuente que usan sus tests (spec-reportes.md 2.11)
      - name: Instalar librerías del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servicios/servicio-ia/pyproject.toml
      - name: Instalar dependencias
        run: |
          pip install -e ".[dev,ml]"
          # Sin dependencias: arrastrarían tensorflow-decision-forests (spec-vision.md 2.1)
          pip install --no-deps tensorflowjs==4.22.0
      - name: Revisar estilo
        run: |
          ruff check .
          ruff format --check .
      - name: Revisar tipos
        run: mypy
      - name: Probar y medir cobertura
        run: pytest --cov
      - name: Construir la imagen Docker
        run: docker build -t servicio-ia:${{ github.sha }} .
