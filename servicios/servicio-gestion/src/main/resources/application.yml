spring:
  application:
    name: servicio-gestion
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-leniency: false
    deserialization:
      fail-on-numbers-for-enums: true
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI}
          issuer-uri: ${KEYCLOAK_ISSUER}
          audiences: ${KEYCLOAK_AUDIENCE:servicio-gestion}

gestion:
  saga:
    cola-comandos: servicio-gestion.comandos
    cola-errores: servicio-gestion.comandos.dlq
    cola-respuestas: servicio-operaciones.respuestas-saga

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      base-path: /
      discovery:
        enabled: false
      path-mapping:
        health: salud
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit
