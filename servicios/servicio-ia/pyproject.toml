[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "servicio-ia"
version = "0.1.0"
description = "Servicio de inteligencia artificial del sistema de campañas agrícolas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.162.0",
    "uvicorn[standard]~=0.54.0",
    "pydantic~=2.14.2",
    "pydantic-settings~=2.16.2",
    "httpx~=0.28.1",
    "pyjwt[crypto]~=2.15.1",
    "google-cloud-firestore~=2.34.1",
    "aio-pika~=10.2.2",
    "scikit-learn~=1.9.1",
    "pandas~=3.1.1",
    "numpy~=2.5.4",
    "joblib~=1.6.0",
    "google-cloud-storage~=3.17.1",
    "pillow~=13.0.0",
    "opencv-python-headless~=5.0.0",
    "python-multipart~=0.0.33",
    "tensorflow-cpu~=2.21.0",
    "mcp~=2.3.0",
    "langgraph~=1.2.20",
    "ollama~=0.6.3",
    "faster-whisper~=1.2.1",
    "weasyprint~=70.0",
    "openpyxl~=3.1.5",
    "jinja2~=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2.0",
    "pytest-asyncio~=1.4.1",
    "pytest-cov~=7.1.0",
    "ruff~=0.17.3",
    "mypy~=2.4.1",
    "pandas-stubs~=3.1.0",
    "pypdf~=7.0.0",
    "types-openpyxl~=3.1.5",
]

# Entrenamiento y exportación del clasificador (spec-vision.md 2.1). Además, aparte:
#   pip install --no-deps tensorflowjs==4.22.0
# (sus dependencias declaradas arrastran tensorflow-decision-forests, que fija otra versión de
# TensorFlow; el conversor no la usa y app/ml/exportar.py la reemplaza por un módulo vacío).
ml = [
    "jax~=0.12.0",
    "tensorflow-hub~=0.16.1",
    "tf-keras~=2.21.0",
    "setuptools<81",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Mensajes de sistema de los agentes (spec-agentes.md 2.5)
app = ["agentes/prompts/*.md", "reportes/plantillas/*", "reportes/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa llamadas en los valores por defecto (Depends, Header, etc.)
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Security",
    "app.comun.seguridad.requerir_roles",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
# Librerías sin anotaciones de tipos publicadas
module = [
    "joblib",
    "sklearn.*",
    "tensorflow.*",
    "tensorflowjs.*",
    "weasyprint.*",
    "faster_whisper.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["lento: usa modelos reales (Whisper tiny); corre también en el pipeline"]
filterwarnings = [
    # Starlette recomienda httpx2; la constitución §2 fija httpx para los tests
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/integracion/*", "app/ml/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
